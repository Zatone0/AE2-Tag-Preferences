name: Release
on:
  push:
    tags: ['[0-9]*', 'v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate version and extract notes
        run: python3 scripts/release.py prepare
      - name: Build
        run: bash ./gradlew clean build --no-configuration-cache
      - name: Package and verify
        run: python3 scripts/release.py package
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: build/release/*
          if-no-files-found: error

  github:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Publish full GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/*.jar dist/SHA256SUMS.txt \
            --verify-tag --title "AE2 Tag Preferences $TAG" \
            --notes-file dist/notes.md --prerelease=false

  curseforge:
    if: startsWith(github.ref, 'refs/tags/')
    needs: github
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: build/release
      - name: Publish full CurseForge release
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: python3 scripts/release.py curseforge
